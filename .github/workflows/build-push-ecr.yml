name: build-push-ecr

# Publica las cuatro imágenes en ECR al crear un tag v*. Requiere los secretos
# AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY (y AWS_SESSION_TOKEN en AWS Academy, cuyas
# credenciales son temporales) y la variable de repositorio AWS_REGION.
# Sin esos secretos el workflow termina con un aviso en lugar de fallar: las imágenes
# también se publican desde el equipo del operador con infra/scripts/desplegar.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Versión a publicar (p. ej. 1.0.0)
        required: true

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TIENE_CREDENCIALES: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Omite la publicación si no hay credenciales de AWS
        if: env.TIENE_CREDENCIALES != 'true'
        run: |
          echo "::notice title=Publicación omitida::No hay secretos AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY en el repositorio. Las imágenes se publican con infra/scripts/desplegar.sh."

      - uses: actions/checkout@v4
        if: env.TIENE_CREDENCIALES == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.TIENE_CREDENCIALES == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Calcula versión y registro
        if: env.TIENE_CREDENCIALES == 'true'
        id: datos
        run: |
          version="${{ inputs.version }}"
          [ -z "$version" ] && version="${GITHUB_REF_NAME#v}"
          cuenta="$(aws sts get-caller-identity --query Account --output text)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registro=$cuenta.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Construye y publica
        if: env.TIENE_CREDENCIALES == 'true'
        env:
          REGISTRO_ECR: ${{ steps.datos.outputs.registro }}
        run: ./infra/scripts/build-push.sh "${{ steps.datos.outputs.version }}"
