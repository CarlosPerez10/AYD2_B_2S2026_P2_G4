name: ventas

on:
  push:
    branches: [main, develop]
    paths:
      - "services/ventas/**"
      - ".github/workflows/ventas.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/ventas/**"
      - ".github/workflows/ventas.yml"

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ventas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ventas/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:coverage

  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construye la imagen
        run: docker build -t libreria-ayd/ventas:${{ github.sha }} services/ventas
      - name: Verifica que arranque, migre y calcule el ranking contra PostgreSQL
        run: |
          docker network create ci
          docker run -d --name ventas-db --network ci \
            -e POSTGRES_DB=ventas_db -e POSTGRES_USER=ventas -e POSTGRES_PASSWORD=ci-123 \
            postgres:16-alpine
          until docker exec ventas-db pg_isready -h 127.0.0.1 -U ventas -d ventas_db; do sleep 1; done
          docker run -d --name ventas --network ci -p 3002:3002 \
            -e DB_HOST=ventas-db -e DB_PASSWORD=ci-123 \
            libreria-ayd/ventas:${{ github.sha }}
          for intento in $(seq 1 15); do
            if curl -fsS http://localhost:3002/health; then
              # El ranking no depende de Libros y la semilla ya trae ventas.
              curl -fsS "http://localhost:3002/api/v1/ventas/ranking" | grep -q '"posicion":1' && exit 0
            fi
            sleep 2
          done
          docker logs ventas
          exit 1
