- name: Ejecuta el contenedor de Ventas
  community.docker.docker_container:
    name: "{{ despliegue_ventas_contenedor }}"
    image: "{{ registro_ecr }}/ventas:{{ version_imagen }}"
    pull: always
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ despliegue_ventas_puerto }}:3002"
    env:
      NODE_ENV: production
      PORT: "3002"
      APP_VERSION: "{{ version_imagen | string }}"
      LOG_LEVEL: "{{ nivel_log }}"
      DB_HOST: "{{ rds_ventas_host }}"
      DB_PORT: "5432"
      DB_NAME: "{{ ventas_db_nombre }}"
      DB_USER: "{{ ventas_db_usuario }}"
      DB_PASSWORD: "{{ ventas_db_password }}"
      DB_SSL: "true"
      LIBROS_SERVICE_URL: "http://{{ ip_privada_libros }}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
  no_log: true # el entorno incluye la contraseña de la base

- name: Espera a que Ventas responda sano
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ despliegue_ventas_puerto }}/health"
    status_code: 200
  register: despliegue_ventas_salud
  until: despliegue_ventas_salud.status == 200
  retries: 30
  delay: 5
