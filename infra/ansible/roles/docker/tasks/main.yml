# Docker Engine desde el repositorio oficial (no el paquete docker.io de Ubuntu).
# apt_repository está obsoleto desde ansible-core 2.19; deb822_repository necesita python3-debian.
- name: Instala la dependencia de deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Agrega el repositorio oficial de Docker con su llave
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ docker_arquitecturas[ansible_architecture] | default('amd64') }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Instala Docker Engine y el plugin de Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true

- name: Configura rotación de logs de los contenedores
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  notify: Reinicia Docker

- name: Habilita y arranca Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Agrega usuarios al grupo docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop:
    - "{{ ansible_user }}"
    - "{{ usuario_despliegue }}"
