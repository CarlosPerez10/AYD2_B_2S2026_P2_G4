server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # En local y en la VM de frontend, el gateway corre en el contenedor "api-gateway".
  # En AWS el ALB ya envía /api/* directo al gateway, así que esta regla casi no se usa allá.
  # DNS interno de Docker. Con el destino en una variable, Nginx vuelve a resolver el nombre
  # cada 10 s: si el contenedor del gateway se recrea con otra IP, /api sigue funcionando
  # y Nginx arranca aunque el gateway todavía no exista.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://api-gateway:8080;

  location /api/ {
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    # index.html no se cachea para que cada despliegue se vea de inmediato.
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
